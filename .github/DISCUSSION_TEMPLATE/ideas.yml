body:
  - type: markdown
    attributes:
      value: |
        Have an idea for improving the platform? Please fill this out with as much context as possible.
  - type: textarea
    attributes:
      label: What problem does this solve?
      description: Describe the problem or gap this idea addresses.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: What would you like to see built or changed?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Any other relevant context, references, or examples.