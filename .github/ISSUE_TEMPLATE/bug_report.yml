name: 🐞 Bug Report
description: Report a bug in the platform
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill this out as completely as possible.
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is and what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: How can this bug be reproduced?
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: Which environment? (preview / production / local)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, logs, Sentry issue links, etc.