name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  DATABASE_URL: postgresql://postgres:password@localhost:5433/dw_test
  DIRECT_URL: postgresql://postgres:password@localhost:5433/dw_test
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock_token
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock
  CLERK_SECRET_KEY: sk_test_mock
  CLERK_WEBHOOK_SECRET: whsec_mock
  AUTH_REDIRECT_PROXY_URL: http://localhost:3000

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./platform/standards/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env.local

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./platform/standards/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./platform/standards/github/setup

      - name: Typecheck
        run: pnpm typecheck

  # RUNTIME TEST
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: ./platform/standards/github/setup

      - name: Runtime Tests
        run: pnpm test:runtime

  # API INFRASTRUCTURE TEST
  infrastructure-test:
    runs-on: ubuntu-latest
    needs: [runtime-test]  # Fast gate before expensive Docker tests
    env:
      # Inject the variables the docker-compose.yml expects
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      UPSTASH_REDIS_REST_TOKEN: mock_token

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./platform/standards/github/setup

      - name: Start Infrastructure
        # -d runs in background; --wait ensures healthchecks pass before moving on
        run: docker compose -f platform/dev-tools/docker/docker-compose.yml up -d --wait

      - name: API Infrastructure Tests
        run: pnpm test:api:infra

      - name: Stop Infrastructure
        if: always()
        run: docker compose -f platform/dev-tools/docker/docker-compose.yml down
