name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  DATABASE_URL: postgresql://postgres:password@localhost:5432/dw_dev
  UPSTASH_REDIS_REST_URL: https://mock-redis.upstash.io
  UPSTASH_REDIS_REST_TOKEN: mock_token
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock
  CLERK_SECRET_KEY: sk_test_mock
  CLERK_WEBHOOK_SECRET: whsec_mock
  AUTH_REDIRECT_PROXY_URL: http://localhost:3000

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./platform/standards/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env.local

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./platform/standards/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./platform/standards/github/setup

      - name: Typecheck
        run: pnpm typecheck

# API INFRASTRUCTURE TEST
  test:
    runs-on: ubuntu-latest
    # SPIN UP POSTGRES
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dw_dev
        ports:
          - 5432:5432
        # Wait until DB is healthy
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./platform/standards/github/setup

      - name: Create Env File
        # We need a .env.local file because your 'with-env' script expects it
        run: |
          echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/dw_dev" >> .env.local
          echo "UPSTASH_REDIS_REST_URL=https://mock-redis.upstash.io" >> .env.local
          echo "UPSTASH_REDIS_REST_TOKEN=mock_token" >> .env.local
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_mock" >> .env.local
          echo "CLERK_SECRET_KEY=sk_test_mock" >> .env.local

      - name: Run API Infrastructure Tests
        run: pnpm api:infrastructure:test
