packages:
  - apps/*
  - packages/*
  - platform/ai
  - platform/cli
  - platform/dev-tools
  - platform/runtime
  - platform/standards/*
  - platform/testing

allowBuilds:
  '@clerk/shared': true
  '@sentry/cli': true
  esbuild: true
  sharp: true

catalog:
  '@clerk/backend': ^3.4.12
  '@clerk/nextjs': ^7.4.1
  '@eslint/js': ^9.39.2
  '@supabase/supabase-js': ^2.97.0
  '@t3-oss/env-core': ^0.13.10
  '@tailwindcss/postcss': ^4.3.0
  '@tailwindcss/vite': ^4.2.1
  '@tanstack/react-form': ^1.28.5
  '@tanstack/react-query': ^5.90.21
  '@trpc/client': ^11.13.4
  '@trpc/server': ^11.13.4
  '@trpc/tanstack-react-query': ^11.13.4
  '@types/node': ^24.13.3
  '@vitejs/plugin-react': 6.0.3
  eslint: ^9.39.4
  prettier: ^3.8.1
  resend: ^6.9.2
  superjson: 2.2.6
  tailwindcss: ^4.2.1
  tsx: ^4.21.0
  typescript: ~6.0.3
  vite: 8.1.4
  vitest: ^4.1.10
  zod: ^4.1.12

catalogs:
  nativewind:
    # react-native-css 3.0.x (and 3.1.0-rc.0) fail on lightningcss >=1.31 ("failed to
    # deserialize; expected an object-like struct named Specifier"):
    # parcel-bundler/lightningcss#1081, nativewind/react-native-css#280.
    # Remove when fixed upstream AND `expo export` passes on the latest lightningcss.
    lightningcss: 1.30.1
  react19:
    # Pinned to Expo SDK 58 (React Native 0.88 requires this exact react).
    # Change only together with an SDK upgrade.
    '@types/react': ~19.3.0
    '@types/react-dom': ~19.3.0
    react: 19.3.0
    react-dom: 19.3.0

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  # react-native-css gets its lightningcss peer from the app AND through @expo/metro-config.
  # Keep both on the catalogs.nativewind pin (1.30.1 satisfies metro-config's ^1.30.1).
  '@expo/metro-config>lightningcss': 'catalog:nativewind'
  '@types/minimatch': 6.0.0
  '@types/react-test-renderer>@types/react': ~19.3.0
  esbuild: ^0.28.1
  js-cookie: ^3.0.7
  path-to-regexp: ^6.3.0
  undici: ^6.27.0
  tar: ^7.5.16

publicHoistPattern:
  - '@ianvs/prettier-plugin-sort-imports'
  - 'prettier-plugin-tailwindcss'
  - 'radix-ui'
  - '@radix-ui/react-icons'
  - 'sonner'
  - 'eslint-plugin-import'
  - 'eslint-plugin-turbo'
  - 'typescript-eslint'
  - '@next/eslint-plugin-next'
