  "@eslint/js": ^9.39.2
  "@t3-oss/env-core": ^0.13.10
  "@tailwindcss/postcss": ^4.1.16
  "@tailwindcss/vite": ^4.1.18
  "@tanstack/react-form": ^1.23.8
