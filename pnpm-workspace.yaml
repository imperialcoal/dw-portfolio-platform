packages:
  - apps/*
  - packages/*
  - platform/ai
  - platform/cli
  - platform/dev-tools
  - platform/runtime
  - platform/standards/*
  - platform/testing

allowBuilds:
  '@clerk/shared': true
  '@sentry/cli': true
  esbuild: true
  sharp: true

catalog:
  '@clerk/backend': ^3.4.12
  '@clerk/nextjs': ^7.4.1
  '@eslint/js': ^9.39.2
  '@supabase/supabase-js': ^2.97.0
  '@t3-oss/env-core': ^0.13.10
  '@tailwindcss/postcss': ^4.3.0
  '@tailwindcss/vite': ^4.2.1
  '@tanstack/react-form': ^1.28.5
  '@tanstack/react-query': ^5.90.21
  '@trpc/client': ^11.13.4
  '@trpc/server': ^11.13.4
  '@trpc/tanstack-react-query': ^11.13.4
  '@types/node': ^24.13.3
  '@vitejs/plugin-react': 6.0.4
  eslint: ^9.39.4
  prettier: ^3.8.1
  resend: ^6.9.2
  superjson: 2.2.6
  tailwindcss: ^4.2.1
  tsx: ^4.21.0
  typescript: ^5.9.3
  vite: 8.1.5
  vitest: ^4.1.10
  zod: ^4.1.12

catalogs:
  react19:
    '@types/react': ~19.2.14
    '@types/react-dom': ~19.2.3
    react: 19.2.8
    react-dom: 19.2.8

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - react-dom@19.2.7
  - react@19.2.7

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  '@types/minimatch': 6.0.0
  '@types/react-test-renderer>@types/react': ~19.2.14
  esbuild: ^0.28.1
  lightningcss: 1.32.0
  js-cookie: ^3.0.7
  path-to-regexp: ^6.3.0
  undici: ^6.27.0
  tar: ^7.5.16

publicHoistPattern:
  - '@ianvs/prettier-plugin-sort-imports'
  - 'prettier-plugin-tailwindcss'
  - 'radix-ui'
  - '@radix-ui/react-icons'
  - 'sonner'
  - 'eslint-plugin-import'
  - 'eslint-plugin-turbo'
  - 'typescript-eslint'
  - '@next/eslint-plugin-next'